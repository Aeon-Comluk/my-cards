<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Golden River COGOP Children's Convention 2026</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #061f49;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .flyer {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
    }

    .button-wrap {
      padding: 20px 16px 28px;
    }

    .download-button {
      display: inline-block;
      width: min(100%, 420px);
      padding: 16px 24px;
      border-radius: 12px;
      background: #ffd21f;
      color: #061f49;
      text-decoration: none;
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 6px 18px rgba(0,0,0,.25);
    }

    .download-button:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>

  <img
    class="flyer"
    src="flyer.png"
    alt="Golden River COGOP Children's Ministry One Day Convention 2026 flyer">

  <div class="button-wrap">
    <a class="download-button" href="program.pdf" download>
      Download PDF
    </a>
  </div>

</body>
</html>
